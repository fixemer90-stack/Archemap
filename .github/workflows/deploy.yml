name: Deploy Placeholder

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    # Ensure CI passes before deploying
    # needs: [ci]  # Uncomment when CI workflow is fully wired
    steps:
      - uses: actions/checkout@v7

      - name: Explain deployment placeholder
        run: |
          echo "=== Manual deployment placeholder ==="
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "This workflow is manual-only and does not deploy on push."
          echo "Configure a real deployment target before using this as release evidence."
          echo "Real image build/deploy wiring lives in build-push-deploy.yml and is gated by ENABLE_YCR_BUILD."
