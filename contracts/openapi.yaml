          type: [number, "null"]
        confidence:
          type: [number, "null"]
        pdf_url:
          type: [string, "null"]
        pdf_generated:
          type: boolean
        report_data:
          type: object
          additionalProperties: true
        narrative:
          oneOf:
            - $ref: "#/components/schemas/NarrativeResponse"
            - type: "null"
        error_message:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaymentMethod:
      type: object
      required: [id, type, is_default]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [card, bank_account]
        card:
          type: object
          properties:
            brand:
              type: string
            last4:
              type: string
              minLength: 4
              maxLength: 4
            exp_month:
              type: integer
            exp_year:
              type: integer
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
