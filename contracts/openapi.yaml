components:
  securitySchemes:
    ChildCookieAuth:
      type: apiKey
      in: cookie
      name: access_token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Client-generated idempotency key (UUID v4)

    UuidIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: UUID key scoped to the authenticated account

    ProfileId:
      name: profile_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    CareerLocked:
      description: Active Plus or grandfathered Career entitlement is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CareerLockedErrorResponse"

    CareerNotFound:
      description: Owned Career resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CareerErrorResponse"

    CareerConflict:
      description: Career lifecycle or idempotency conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CareerErrorResponse"

    CareerValidationError:
      description: Career request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CareerErrorResponse"

    CareerUnavailable:
      description: Career generation queue or provider is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CareerErrorResponse"

    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RefinementError"

    RefinementBadRequest:
      description: No material change or inconsistent birth time accuracy
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RefinementError"

    ProfileNotOwned:
      description: Profile is not owned by the authenticated user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RefinementError"

    IdempotencyConflict:
      description: Idempotency key was reused with another normalized payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RefinementError"

    BirthPlaceNotGeocoded:
      description: Place, coordinates, or IANA timezone are invalid or inconsistent
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RefinementError"

    BirthDataRefinementCooldown:
      description: The account-wide rolling 24-hour cooldown has not elapsed
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RefinementCooldownError"

    RefinementEnqueueUnavailable:
      description: Revision persisted but worker dispatch is unavailable; retry with the same key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RefinementError"

