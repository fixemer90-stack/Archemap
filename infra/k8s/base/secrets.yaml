apiVersion: v1
kind: Secret
metadata:
  name: astrotype-secrets
type: Opaque
stringData:
  SECRET_KEY: "CHANGE_ME_IN_PRODUCTION"
  DATABASE_URL: "postgresql+asyncpg://astrotype:CHANGE_ME@postgres:5432/astrotype"
  REDIS_URL: "redis://redis:6379/0"
  YANDEX_CLIENT_ID: ""
  YANDEX_CLIENT_SECRET: ""
  YANDEX_REDIRECT_URI: "https://astrotype.ru/api/v1/auth/oauth/yandex/callback"
  FRONTEND_URL: "https://astrotype.ru"
  SMTP_HOST: "smtp.yandex.ru"
  SMTP_PORT: "465"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  SMTP_FROM_EMAIL: "noreply@astrotype.ru"
  SMTP_FROM_NAME: "Astrotype"
  S3_ENDPOINT_URL: "https://storage.yandexcloud.net"
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
  S3_BUCKET_NAME: "astrotype-reports"
  S3_REGION: "ru-central1"
