openapi: 3.1.0
info:
  title: Astrotype API
  version: 1.0.0
  description: |
    Astrotype — subscription and account platform API.
    Contract-first design; all consumers generate clients from this spec.
  contact:
    name: Astrotype Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api.astrotype.dev
    description: Staging
  - url: https://api.astrotype.io
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Service health
  - name: Auth
    description: Authentication & authorization
  - name: Users
    description: User profile management
  - name: Subscriptions
    description: Subscription lifecycle
  - name: Billing
    description: Invoices & billing
  - name: Payments
    description: Payment processing
  - name: Reports
    description: Deterministic reports and narrative generation lifecycle

paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/auth/login:
    post:
      operationId: authLogin
      tags: [Auth]
      summary: Initiate OAuth login flow
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login URL or token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/auth/callback:
    post:
      operationId: authCallback
      tags: [Auth]
      summary: OAuth callback handler
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallbackRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/users/me:
    get:
      operationId: getCurrentUser
      tags: [Users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/subscriptions:
    get:
      operationId: listSubscriptions
      tags: [Subscriptions]
      summary: List user subscriptions
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, cancelled, expired, past_due]
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Subscription list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionList"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: createSubscription
      tags: [Subscriptions]
      summary: Create a new subscription
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionRequest"
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/subscriptions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getSubscription
      tags: [Subscriptions]
      summary: Get subscription by ID
      responses:
        "200":
          description: Subscription details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateSubscription
      tags: [Subscriptions]
      summary: Update subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriptionRequest"
      responses:
        "200":
          description: Subscription updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

    delete:
      operationId: cancelSubscription
      tags: [Subscriptions]
      summary: Cancel subscription
      responses:
        "204":
          description: Subscription cancelled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/billing/invoices:
    get:
      operationId: listInvoices
      tags: [Billing]
      summary: List invoices
      parameters:
        - name: subscription_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Invoice list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/billing/invoices/{id}:
    get:
      operationId: getInvoice
      tags: [Billing]
      summary: Get invoice by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Invoice details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/payments/checkout:
    post:
      operationId: createCheckout
      tags: [Payments]
      summary: Create a checkout session
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "201":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/payments/methods:
    get:
      operationId: listPaymentMethods
      tags: [Payments]
      summary: List saved payment methods
      responses:
        "200":
          description: Payment method list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentMethod"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/reports/generate:
    post:
      operationId: generateReport
      tags: [Reports]
      summary: Generate deterministic report and enqueue narrative generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateReportRequest"
      responses:
        "200":
          description: Report created or refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/reports/{report_id}:
    get:
      operationId: getReport
      tags: [Reports]
      summary: Get report with deterministic payload and latest narrative state
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Report details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/reports/{report_id}/narrative/regenerate:
    post:
      operationId: regenerateReportNarrative
      tags: [Reports]
      summary: Enqueue a fresh LLM narrative attempt without recomputing deterministic report data
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Narrative regeneration accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/BadRequest"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Client-generated idempotency key (UUID v4)

    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        uptime_seconds:
          type: number

    LoginRequest:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [vkid, google, telegram]
        redirect_uri:
          type: string
          format: uri

    LoginResponse:
      type: object
      required: [auth_url, state]
      properties:
        auth_url:
          type: string
          format: uri
        state:
          type: string

    CallbackRequest:
      type: object
      required: [code, state]
      properties:
        code:
          type: string
        state:
          type: string

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          default: bearer
        expires_in:
          type: integer
          description: Access token TTL in seconds

    User:
      type: object
      required: [id, email, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
        provider:
          type: string
          enum: [vkid, google, telegram]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Subscription:
      type: object
      required: [id, user_id, plan_id, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        plan:
          $ref: "#/components/schemas/Plan"
        status:
          type: string
          enum: [active, cancelled, expired, past_due, trialing]
        current_period_start:
          type: string
          format: date-time
        current_period_end:
          type: string
          format: date-time
        cancel_at_period_end:
          type: boolean
          default: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SubscriptionList:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Subscription"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    CreateSubscriptionRequest:
      type: object
      required: [plan_id]
      properties:
        plan_id:
          type: string
          format: uuid
        payment_method_id:
          type: string
        trial_days:
          type: integer
          minimum: 0

    UpdateSubscriptionRequest:
      type: object
      properties:
        plan_id:
          type: string
          format: uuid
        cancel_at_period_end:
          type: boolean

    Plan:
      type: object
      required: [id, name, amount, currency, interval]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        amount:
          type: integer
          description: Amount in minor units (e.g., cents)
        currency:
          type: string
          minLength: 3
          maxLength: 3
        interval:
          type: string
          enum: [month, year]
        trial_days:
          type: integer
        features:
          type: array
          items:
            type: string
        is_active:
          type: boolean

    Invoice:
      type: object
      required: [id, subscription_id, amount, currency, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        amount:
          type: integer
        currency:
          type: string
        status:
          type: string
          enum: [draft, open, paid, void, uncollectible]
        due_date:
          type: string
          format: date
        paid_at:
          type: string
          format: date-time
        pdf_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time

    InvoiceList:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    CheckoutRequest:
      type: object
      required: [plan_id]
      properties:
        plan_id:
          type: string
          format: uuid
        success_url:
          type: string
          format: uri
        cancel_url:
          type: string
          format: uri
        payment_method_id:
          type: string

    CheckoutResponse:
      type: object
      required: [checkout_url, session_id]
      properties:
        checkout_url:
          type: string
          format: uri
        session_id:
          type: string

    GenerateReportRequest:
      type: object
      required: [profile_id, product, mode]
      properties:
        profile_id:
          type: string
          format: uuid
        product:
          type: string
        mode:
          type: string
          enum: [preview, full]

    NarrativeResponse:
      type: object
      required:
        [id, report_id, product, prompt_version, model_provider, model_name, status, sections, generation_attempts, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        report_id:
          type: string
          format: uuid
        product:
          type: string
        prompt_version:
          type: string
        model_provider:
          type: string
        model_name:
          type: string
        status:
          type: string
        title:
          type: [string, "null"]
        hero:
          type: [object, "null"]
          additionalProperties: true
        sections:
          type: array
          items:
            type: object
            additionalProperties: true
        career_cta:
          type: [object, "null"]
          additionalProperties: true
        content:
          type: [object, "null"]
          additionalProperties: true
        error_message:
          type: [string, "null"]
        generation_started_at:
          type: [string, "null"]
          format: date-time
        generation_finished_at:
          type: [string, "null"]
          format: date-time
        generation_attempts:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ReportResponse:
      type: object
      required: [id, profile_id, product, version, status, mode, pdf_generated, report_data, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        profile_id:
          type: string
          format: uuid
        product:
          type: string
        version:
          type: integer
        status:
          type: string
        mode:
          type: string
        archetype:
          type: [string, "null"]
        score:
          type: [number, "null"]
        confidence:
          type: [number, "null"]
        pdf_url:
          type: [string, "null"]
        pdf_generated:
          type: boolean
        report_data:
          type: object
          additionalProperties: true
        narrative:
          oneOf:
            - $ref: "#/components/schemas/NarrativeResponse"
            - type: "null"
        error_message:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaymentMethod:
      type: object
      required: [id, type, is_default]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [card, bank_account]
        card:
          type: object
          properties:
            brand:
              type: string
            last4:
              type: string
              minLength: 4
              maxLength: 4
            exp_month:
              type: integer
            exp_year:
              type: integer
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
