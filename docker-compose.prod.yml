services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astrotype}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-astrotype}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-astrotype} -d ${POSTGRES_DB:-astrotype}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-astrotype}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-astrotype}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      FRONTEND_URL: https://astrotype.ru
      ALLOWED_ORIGINS: '["https://astrotype.ru","https://www.astrotype.ru"]'
      YANDEX_REDIRECT_URI: https://astrotype.ru/api/v1/auth/oauth/yandex/callback
      BIRTH_DATA_REFINEMENT_ENABLED: ${BIRTH_DATA_REFINEMENT_ENABLED:-false}
      BIRTH_DATA_REFINEMENT_STUCK_AFTER_MINUTES: ${BIRTH_DATA_REFINEMENT_STUCK_AFTER_MINUTES:-20}
      BIRTH_DATA_REFINEMENT_MONITOR_WINDOW_MINUTES: ${BIRTH_DATA_REFINEMENT_MONITOR_WINDOW_MINUTES:-15}
      BIRTH_DATA_REFINEMENT_MONITOR_INTERVAL_SECONDS: ${BIRTH_DATA_REFINEMENT_MONITOR_INTERVAL_SECONDS:-300}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${WEB_CONCURRENCY:-1}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-astrotype}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-astrotype}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      FRONTEND_URL: https://astrotype.ru
      ALLOWED_ORIGINS: '["https://astrotype.ru","https://www.astrotype.ru"]'
      YANDEX_REDIRECT_URI: https://astrotype.ru/api/v1/auth/oauth/yandex/callback
      BIRTH_DATA_REFINEMENT_ENABLED: ${BIRTH_DATA_REFINEMENT_ENABLED:-false}
      BIRTH_DATA_REFINEMENT_STUCK_AFTER_MINUTES: ${BIRTH_DATA_REFINEMENT_STUCK_AFTER_MINUTES:-20}
      BIRTH_DATA_REFINEMENT_MONITOR_WINDOW_MINUTES: ${BIRTH_DATA_REFINEMENT_MONITOR_WINDOW_MINUTES:-15}
      BIRTH_DATA_REFINEMENT_MONITOR_INTERVAL_SECONDS: ${BIRTH_DATA_REFINEMENT_MONITOR_INTERVAL_SECONDS:-300}
    command: celery -A workers.celery_app.app worker --loglevel=INFO -Q celery --concurrency=${CELERY_CONCURRENCY:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  refinement-monitor:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-astrotype}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-astrotype}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      FRONTEND_URL: https://astrotype.ru
      ALLOWED_ORIGINS: '["https://astrotype.ru","https://www.astrotype.ru"]'
      YANDEX_REDIRECT_URI: https://astrotype.ru/api/v1/auth/oauth/yandex/callback
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-astrotype-production}-refinement-monitor
      BIRTH_DATA_REFINEMENT_ENABLED: ${BIRTH_DATA_REFINEMENT_ENABLED:-false}
      BIRTH_DATA_REFINEMENT_STUCK_AFTER_MINUTES: ${BIRTH_DATA_REFINEMENT_STUCK_AFTER_MINUTES:-20}
      BIRTH_DATA_REFINEMENT_MONITOR_WINDOW_MINUTES: ${BIRTH_DATA_REFINEMENT_MONITOR_WINDOW_MINUTES:-15}
      BIRTH_DATA_REFINEMENT_MONITOR_INTERVAL_SECONDS: ${BIRTH_DATA_REFINEMENT_MONITOR_INTERVAL_SECONDS:-300}
    command: celery -A workers.celery_app.app worker --loglevel=INFO -Q birth-data-monitor --concurrency=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-astrotype}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-astrotype}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      FRONTEND_URL: https://astrotype.ru
      ALLOWED_ORIGINS: '["https://astrotype.ru","https://www.astrotype.ru"]'
      YANDEX_REDIRECT_URI: https://astrotype.ru/api/v1/auth/oauth/yandex/callback
      BIRTH_DATA_REFINEMENT_ENABLED: ${BIRTH_DATA_REFINEMENT_ENABLED:-false}
      BIRTH_DATA_REFINEMENT_STUCK_AFTER_MINUTES: ${BIRTH_DATA_REFINEMENT_STUCK_AFTER_MINUTES:-20}
      BIRTH_DATA_REFINEMENT_MONITOR_WINDOW_MINUTES: ${BIRTH_DATA_REFINEMENT_MONITOR_WINDOW_MINUTES:-15}
      BIRTH_DATA_REFINEMENT_MONITOR_INTERVAL_SECONDS: ${BIRTH_DATA_REFINEMENT_MONITOR_INTERVAL_SECONDS:-300}
    command: celery -A workers.celery_app.app beat --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BIRTH_DATA_REFINEMENT_ENABLED: ${NEXT_PUBLIC_BIRTH_DATA_REFINEMENT_ENABLED:-false}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_BIRTH_DATA_REFINEMENT_ENABLED: ${NEXT_PUBLIC_BIRTH_DATA_REFINEMENT_ENABLED:-false}
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - default
      - edge

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  edge:
    external: true
    name: astrotype_edge
