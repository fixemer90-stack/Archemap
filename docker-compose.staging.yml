services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astrotype_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-astrotype_staging}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-astrotype_staging} -d ${POSTGRES_DB:-astrotype_staging}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel-collector.staging.yaml:/etc/otelcol-contrib/config.yaml:ro
    healthcheck:
      test:
        [
          "CMD",
          "/otelcol-contrib",
          "validate",
          "--config=/etc/otelcol-contrib/config.yaml",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.53.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.external-url=https://staging.astrotype.ru/career-metrics/
      - --web.route-prefix=/
    volumes:
      - ./deploy/prometheus.staging.yaml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus-birth-data-refinement.rules.yaml:/etc/prometheus/rules/birth-data-refinement.yaml:ro
      - prometheus_staging_data:/prometheus
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-astrotype_staging}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-astrotype_staging}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      FRONTEND_URL: https://staging.astrotype.ru
      ALLOWED_ORIGINS: '["https://staging.astrotype.ru"]'
      YANDEX_REDIRECT_URI: https://staging.astrotype.ru/api/v1/auth/oauth/yandex/callback
      BIRTH_DATA_REFINEMENT_ENABLED: "true"
      BIRTH_DATA_REFINEMENT_STUCK_AFTER_MINUTES: "20"
      BIRTH_DATA_REFINEMENT_MONITOR_WINDOW_MINUTES: "15"
      BIRTH_DATA_REFINEMENT_MONITOR_INTERVAL_SECONDS: "300"
      AUTO_VERIFY_EMAIL: "true"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${WEB_CONCURRENCY:-1}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      default:
      edge:
        aliases:
          - staging-backend

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-astrotype_staging}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-astrotype_staging}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      FRONTEND_URL: https://staging.astrotype.ru
      ALLOWED_ORIGINS: '["https://staging.astrotype.ru"]'
      YANDEX_REDIRECT_URI: https://staging.astrotype.ru/api/v1/auth/oauth/yandex/callback
      BIRTH_DATA_REFINEMENT_ENABLED: "true"
      BIRTH_DATA_REFINEMENT_STUCK_AFTER_MINUTES: "20"
      BIRTH_DATA_REFINEMENT_MONITOR_WINDOW_MINUTES: "15"
      BIRTH_DATA_REFINEMENT_MONITOR_INTERVAL_SECONDS: "300"
    command: celery -A workers.celery_app.app worker --loglevel=INFO --concurrency=${CELERY_CONCURRENCY:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-astrotype_staging}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-astrotype_staging}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      FRONTEND_URL: https://staging.astrotype.ru
      ALLOWED_ORIGINS: '["https://staging.astrotype.ru"]'
      YANDEX_REDIRECT_URI: https://staging.astrotype.ru/api/v1/auth/oauth/yandex/callback
      BIRTH_DATA_REFINEMENT_ENABLED: "true"
      BIRTH_DATA_REFINEMENT_STUCK_AFTER_MINUTES: "20"
      BIRTH_DATA_REFINEMENT_MONITOR_WINDOW_MINUTES: "15"
      BIRTH_DATA_REFINEMENT_MONITOR_INTERVAL_SECONDS: "300"
    command: celery -A workers.celery_app.app beat --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BIRTH_DATA_REFINEMENT_ENABLED: "true"
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_BIRTH_DATA_REFINEMENT_ENABLED: "true"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      default:
      edge:
        aliases:
          - staging-frontend

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - ./deploy/staging-basic-auth.caddy:/run/secrets/staging-basic-auth.caddy:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    networks:
      default:
      edge:
        aliases:
          - staging-gateway

volumes:
  postgres_staging_data:
  redis_staging_data:
  prometheus_staging_data:

networks:
  edge:
    external: true
    name: astrotype_edge
