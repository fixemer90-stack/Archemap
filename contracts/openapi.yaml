openapi: 3.1.0
info:
  title: Astrotype API
  version: 1.0.0
  description: |
    Astrotype — subscription and account platform API.
    Contract-first design; all consumers generate clients from this spec.
  contact:
    name: Astrotype Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api.astrotype.dev
    description: Staging
  - url: https://api.astrotype.io
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Service health
  - name: Auth
    description: Authentication & authorization
  - name: Users
    description: User profile management
  - name: Subscriptions
    description: Subscription lifecycle
  - name: Billing
    description: Invoices & billing
  - name: Payments
    description: Payment processing
  - name: Career
    description: Async Career questionnaire, generation, progressive report, history, and PDF lifecycle
  - name: Reports
    description: Deterministic reports and narrative generation lifecycle
  - name: Profiles
    description: Person profiles, geocoding, and birth-data refinement

paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/auth/login:
    post:
      operationId: authLogin
      tags: [Auth]
      summary: Initiate OAuth login flow
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login URL or token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/auth/callback:
    post:
      operationId: authCallback
      tags: [Auth]
      summary: OAuth callback handler
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallbackRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/users/me:
    get:
      operationId: getCurrentUser
      tags: [Users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/subscriptions:
    get:
      operationId: listSubscriptions
      tags: [Subscriptions]
      summary: List user subscriptions
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, cancelled, expired, past_due]
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Subscription list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionList"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: createSubscription
      tags: [Subscriptions]
      summary: Create a new subscription
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionRequest"
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/subscriptions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getSubscription
      tags: [Subscriptions]
      summary: Get subscription by ID
      responses:
        "200":
          description: Subscription details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateSubscription
      tags: [Subscriptions]
      summary: Update subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriptionRequest"
      responses:
        "200":
          description: Subscription updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

    delete:
      operationId: cancelSubscription
      tags: [Subscriptions]
      summary: Cancel subscription
      responses:
        "204":
          description: Subscription cancelled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/billing/invoices:
    get:
      operationId: listInvoices
      tags: [Billing]
      summary: List invoices
      parameters:
        - name: subscription_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Invoice list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/billing/invoices/{id}:
    get:
      operationId: getInvoice
      tags: [Billing]
      summary: Get invoice by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Invoice details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/payments/checkout:
    post:
      operationId: createCheckout
      tags: [Payments]
      summary: Create a checkout session
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "201":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/payments/methods:
    get:
      operationId: listPaymentMethods
      tags: [Payments]
      summary: List saved payment methods
      responses:
        "200":
          description: Payment method list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentMethod"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/career/questionnaires/current:
    get:
      tags:
      - Career
      summary: Get Current Questionnaire
      operationId: getCurrentCareerQuestionnaire
      security:
      - bearerAuth: []
      parameters:
      - name: profile_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Profile Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnaireCurrentResponse'
        '402':
          $ref: '#/components/responses/CareerLocked'
        '404':
          $ref: '#/components/responses/CareerNotFound'
        '409':
          $ref: '#/components/responses/CareerConflict'
        '422':
          $ref: '#/components/responses/CareerValidationError'
        '503':
          $ref: '#/components/responses/CareerUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/career/questionnaires/{session_id}/answers:
    put:
      tags:
      - Career
      summary: Put Questionnaire Answers
      operationId: saveCareerQuestionnaireAnswers
      security:
      - bearerAuth: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionnaireAnswersRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnaireResponse'
        '402':
          $ref: '#/components/responses/CareerLocked'
        '404':
          $ref: '#/components/responses/CareerNotFound'
        '409':
          $ref: '#/components/responses/CareerConflict'
        '422':
          $ref: '#/components/responses/CareerValidationError'
        '503':
          $ref: '#/components/responses/CareerUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/career/questionnaires/{session_id}/complete:
    post:
      tags:
      - Career
      summary: Complete Questionnaire
      operationId: completeCareerQuestionnaire
      security:
      - bearerAuth: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 120
          title: Idempotency-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnaireResponse'
        '402':
          $ref: '#/components/responses/CareerLocked'
        '404':
          $ref: '#/components/responses/CareerNotFound'
        '409':
          $ref: '#/components/responses/CareerConflict'
        '422':
          $ref: '#/components/responses/CareerValidationError'
        '503':
          $ref: '#/components/responses/CareerUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/career/reports:
    post:
      tags:
      - Career
      summary: Create Career Report
      operationId: createCareerReport
      security:
      - bearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 120
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCareerReportRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerGenerationAcceptedResponse'
        '402':
          $ref: '#/components/responses/CareerLocked'
        '404':
          $ref: '#/components/responses/CareerNotFound'
        '409':
          $ref: '#/components/responses/CareerConflict'
        '422':
          $ref: '#/components/responses/CareerValidationError'
        '503':
          $ref: '#/components/responses/CareerUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/career/generations/{generation_id}:
    get:
      tags:
      - Career
      summary: Get Career Generation
      operationId: getCareerGeneration
      security:
      - bearerAuth: []
      parameters:
      - name: generation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Generation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerGenerationStatusResponse'
        '402':
          $ref: '#/components/responses/CareerLocked'
        '404':
          $ref: '#/components/responses/CareerNotFound'
        '409':
          $ref: '#/components/responses/CareerConflict'
        '422':
          $ref: '#/components/responses/CareerValidationError'
        '503':
          $ref: '#/components/responses/CareerUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/career/reports/{report_id}:
    get:
      tags:
      - Career
      summary: Get Career Report
      operationId: getCareerReport
      security:
      - bearerAuth: []
      parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Report Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerReportResponse'
        '402':
          $ref: '#/components/responses/CareerLocked'
        '404':
          $ref: '#/components/responses/CareerNotFound'
        '409':
          $ref: '#/components/responses/CareerConflict'
        '422':
          $ref: '#/components/responses/CareerValidationError'
        '503':
          $ref: '#/components/responses/CareerUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/career/reports/{report_id}/sections:
    get:
      tags:
      - Career
      summary: Get Career Report Sections
      operationId: getCareerReportSections
      security:
      - bearerAuth: []
      parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Report Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerSectionsResponse'
        '402':
          $ref: '#/components/responses/CareerLocked'
        '404':
          $ref: '#/components/responses/CareerNotFound'
        '409':
          $ref: '#/components/responses/CareerConflict'
        '422':
          $ref: '#/components/responses/CareerValidationError'
        '503':
          $ref: '#/components/responses/CareerUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/career/reports/{report_id}/versions:
    get:
      tags:
      - Career
      summary: Get Career Report Versions
      operationId: listCareerReportVersions
      security:
      - bearerAuth: []
      parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Report Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerReportHistoryResponse'
        '402':
          $ref: '#/components/responses/CareerLocked'
        '404':
          $ref: '#/components/responses/CareerNotFound'
        '409':
          $ref: '#/components/responses/CareerConflict'
        '422':
          $ref: '#/components/responses/CareerValidationError'
        '503':
          $ref: '#/components/responses/CareerUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/career/reports/{report_id}/regenerate:
    post:
      tags:
      - Career
      summary: Regenerate Career Report
      operationId: regenerateCareerReport
      security:
      - bearerAuth: []
      parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Report Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 120
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegenerateCareerReportRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerGenerationAcceptedResponse'
        '402':
          $ref: '#/components/responses/CareerLocked'
        '404':
          $ref: '#/components/responses/CareerNotFound'
        '409':
          $ref: '#/components/responses/CareerConflict'
        '422':
          $ref: '#/components/responses/CareerValidationError'
        '503':
          $ref: '#/components/responses/CareerUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/career/reports/{report_id}/pdf:
    get:
      tags:
      - Career
      summary: Get Career Report Pdf
      operationId: downloadCareerReportPdf
      security:
      - bearerAuth: []
      parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Report Id
      responses:
        '200':
          description: Career report PDF rendered from the persisted owned report
          headers:
            Content-Disposition:
              description: Attachment filename
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '402':
          $ref: '#/components/responses/CareerLocked'
        '404':
          $ref: '#/components/responses/CareerNotFound'
        '409':
          $ref: '#/components/responses/CareerConflict'
        '422':
          $ref: '#/components/responses/CareerValidationError'
        '503':
          $ref: '#/components/responses/CareerUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/reports/generate:
    post:
      operationId: generateReport
      tags: [Reports]
      summary: Generate deterministic report and enqueue narrative generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateReportRequest"
      responses:
        "200":
          description: Report created or refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/reports/{report_id}:
    get:
      operationId: getReport
      tags: [Reports]
      summary: Get report with deterministic payload and latest narrative state
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Report details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/reports/{report_id}/pdf:
    get:
      operationId: downloadReportPdf
      tags: [Reports]
      summary: Render report PDF on demand from stored report JSON
      description: |
        The API does not require a pre-generated PDF artifact, `pdf_url`,
        `pdf_generated=true`, S3, MinIO, or signed URLs. It loads persisted
        report JSON and the latest saved narrative JSON, renders the PDF, and
        returns the bytes directly.
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: PDF rendered from persisted JSON
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Attachment filename for the generated PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/reports/{report_id}/narrative/regenerate:
    post:
      operationId: regenerateReportNarrative
      tags: [Reports]
      summary: Enqueue a fresh LLM narrative attempt without recomputing deterministic report data
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Narrative regeneration accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/BadRequest"

  /v1/profiles/geocode:
    get:
      operationId: searchProfileBirthPlaces
      tags: [Profiles]
      summary: Search geocoded birth places with resolved IANA timezones
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Geocoded place suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeocodeSearchResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/profiles/{profile_id}/birth-data-refinement-status:
    get:
      operationId: getBirthDataRefinementStatus
      tags: [Profiles]
      summary: Get account-wide birth-data refinement cooldown status
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: Current refinement availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BirthDataRefinementStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileNotOwned"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/profiles/{profile_id}/birth-data-refinements:
    post:
      operationId: createBirthDataRefinement
      tags: [Profiles]
      summary: Persist and enqueue a complete birth-data refinement snapshot
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/UuidIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BirthDataRefinementRequest"
      responses:
        "202":
          description: Refinement revision persisted and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BirthDataRefinementAccepted"
        "400":
          $ref: "#/components/responses/RefinementBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileNotOwned"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "422":
          $ref: "#/components/responses/BirthPlaceNotGeocoded"
        "429":
          $ref: "#/components/responses/BirthDataRefinementCooldown"
        "503":
          $ref: "#/components/responses/RefinementEnqueueUnavailable"

  /v1/profiles/{profile_id}/birth-data-refinements/{revision_id}:
    get:
      operationId: getBirthDataRefinementRevision
      tags: [Profiles]
      summary: Get persisted birth-data refinement revision status
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Persisted revision status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BirthDataRevisionStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileNotOwned"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/child/children:
    get:
      tags:
      - child
      summary: List Children
      operationId: list_children_api_v1_child_children_get
      security:
      - bearerAuth: []
      - ChildCookieAuth: []
      parameters:
      - name: include_archived
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Archived
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildrenResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildErrorResponse'
          description: Unauthorized
        '402':
          content:
            application/json:
              schema:
