# Self vertical — archetype rules v1.0.0
# Archemap Design Code: explainable, deterministic, rule-based
# Each rule produces archetype scores and claim contributions
# with full evidence trail and confidence adjustments.

product: self
version: "1.0.0"
effective_from: "2026-01-01"
locale: ru-RU

archetypes:
  strateg:
    name: "Стратег"
    description: "Системный мышлитель с выраженной способностью к структурированию"
    conditions:
      all:
        - fact: feature.earth
          op: gte
          value: 0.35
        - fact: feature.fixed
          op: gte
          value: 0.30
    effects:
      archetype.strateg: 0.25
      claim.self.structure_strength: 0.20
    confidence_adjustments:
      - when:
          fact: quality.birth_time_quality
          op: lt
          value: 0.50
        delta: -0.10
    counter_rules: ["spontaneous_creator"]
    evidence:
      template_key: ev.self.strateg
      show_basis_features: [feature.earth, feature.fixed]

  creator:
    name: "Творец"
    description: "Спонтанный генератор идей с выраженной огненной энергией"
