# Scoring parameters (versioned separately from code)
scoring:
  # Contribution formula: contrib_r = w_r × match_r × q_input × q_rule
  default_weight: 1.0
  default_q_rule: 1.0

  # Aggregation: score_k = clamp((bias + Σ support - λ × Σ counter) / max_possible, 0, 1)
  default_bias: 0.0
  counter_penalty_lambda: 0.30
  max_possible_score: 1.0

  # Claim selection thresholds
  min_claim_score: 0.15
  max_claims_per_section: 3

# Confidence model (4-factor)
confidence:
  weights:
    q_input: 0.35
    q_coverage: 0.30
    q_margin: 0.20
    q_consistency: 0.15

  # Reason code thresholds
  thresholds:
    good_input: 0.70
    low_coverage: 0.30
    high_contradiction: 0.40
    low_margin: 0.10

  # Labels
  labels:
    high: [0.80, 1.0]
    medium_high: [0.60, 0.80]
    medium: [0.40, 0.60]
    medium_low: [0.20, 0.40]
    low: [0.0, 0.20]
