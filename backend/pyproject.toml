[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "workers"]

[project]
name = "astrotype"
version = "0.1.0"
description = "Astrotype — subscription and account platform"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.18.4,<2",
    "redis>=5.2,<6",
    "celery[redis]>=5.4,<6",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.7,<3",
    "python-jose[cryptography]>=3.3,<4",
    "cryptography>=46.0.7",
    "cffi>=2.0",
    "bcrypt>=4.1,<6",
    "structlog>=25.5.0,<26",
    "opentelemetry-api>=1.29,<2",
    "opentelemetry-sdk>=1.29,<2",
    "boto3>=1.38,<2",
    "weasyprint>=68,<70",
    "jinja2>=3.1,<4",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "python-multipart>=0.0.18",
    "email-validator>=2.2,<3",
    "timezonefinder>=8.0,<9",
    "pyswisseph>=2.10,<3",
    "flatlib>=0.2,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=6,<7",
    "respx>=0.22,<1",
    "httpx>=0.28,<1",
    "mypy>=1.13,<2",
    "ruff>=0.8,<1",
    "pre-commit>=4,<5",
    "pip-audit>=2.10.0,<3",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
astrotype = "app.main:run"

# ── Ruff ──────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "workers", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "ASYNC",    # flake8-async
    "S",        # flake8-bandit
    "RUF",      # ruff-specific
]
ignore = ["S101", "B008", "S104", "S105"]  # S101: assert in tests; B008: FastAPI Depends(); S104/S105: dev defaults

[tool.ruff.lint.isort]
known-first-party = ["app", "workers"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E402", "F401", "F403"]  # alembic needs late imports for model registration
"app/infrastructure/email_templates.py" = ["RUF001"]  # Cyrillic in email templates

# ── Mypy ──────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["celery.*", "jose.*", "sentry_sdk.*", "redis.*", "bcrypt.*", "yaml.*", "swisseph.*", "pyswisseph.*", "weasyprint.*", "boto3.*", "botocore.*", "jinja2.*"]
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
