# Evidence templates for Self vertical
# Each template provides human-readable explanations for claims

product: self
version: "1.0.0"
locale: ru-RU

templates:
  ev.self.strateg:
    title: "Стратег"
    summary: "Выражена способность к структурированию и системному мышлению."
    evidence_text: "Ваша карта показывает выраженную земную энергию ({earth:.0%}) и стабильность фиксированных знаков ({fixed:.0%}). Это создаёт основу для системного подхода к решению задач."
    counter_text: "При этом огненная спонтанность ({fire:.0%}) может конфликтовать с потребностью в структуре."
    reflection: "Где в вашей жизни системный подход приносит наибольшие результаты?"

  ev.self.creator:
    title: "Творец"
    summary: "Спонтанный генератор идей с выраженной огненной энергией."
    evidence_text: "Огненная стихия ({fire:.0%}) в сочетании с мутабельностью ({mutable:.0%}) создаёт условия для творческого потока и генерации идей."
    counter_text: "Земная стабильность ({earth:.0%}) может ограничивать спонтанность."
    reflection: "Какие условия необходимы для вашего творческого расцвета?"

  ev.self.explorer:
    title: "Исследователь"
    summary: "Интеллектуальный навигатор с потребностью в разнообразии."
    evidence_text: "Воздушная стихия ({air:.0%}) и мутабельность ({mutable:.0%}) формируют потребность в разнообразии и интеллектуальном исследовании."
    counter_text: "Земная стабильность ({earth:.0%}) может создавать напряжение с потребностью в переменам."
    reflection: "Что вы исследуете с наибольшим интересом?"

  ev.self.anchor:
    title: "Опора"
    summary: "Надёжная основа с выраженной земной стабильностью."
    evidence_text: "Выраженная земная стихия ({earth:.0%}) в сочетании с кардинальностью ({cardinal:.0%}) создаёт прочную основу для надёжности и ответственности."
    counter_text: "Воздушная потребность в разнообразии ({air:.0%}) может конфликтовать с ролью опоры."
    reflection: "Где вы чувствуете себя наиболее надёжной опорой?"

  ev.self.diplomat:
    title: "Дипломат"
    summary: "Мастер баланса и гармоничного взаимодействия."
    evidence_text: "Воздушная стихия ({air:.0%}) и кардинальность ({cardinal:.0%}) формируют способность к балансированию интересов и поиску гармонии."
    counter_text: "Огненная прямолинейность ({fire:.0%}) может нарушать дипломатический подход."
    reflection: "В каких ситуациях ваш дипломатический талант проявляется ярче всего?"

  ev.self.catalyst:
    title: "Катализатор"
    summary: "Инициатор изменений с выраженной огненной волей."
    evidence_text: "Огненная стихия ({fire:.0%}) и кардинальность ({cardinal:.0%}) создают энергию инициации и запуска процессов."
    counter_text: "Воздушная потребность в балансе ({air:.0%}) может смягчать катализаторский эффект."
    reflection: "Что вы чаще всего запускаете или инициируете?"

  ev.self.mentor:
    title: "Наставник"
    summary: "Проводник глубинных процессов с выраженной водной мудростью."
    evidence_text: "Водная стихия ({water:.0%}) и мутабельность ({mutable:.0%}) формируют глубинное понимание процессов и способность проводить через трансформации."
    counter_text: "Земная практичность ({earth:.0%}) может ограничивать глубину восприятия."
    reflection: "Кому и в чём вы чаще всего становитесь наставником?"

  ev.self.builder:
    title: "Строитель"
    summary: "Мастер долгосрочных конструкций с выраженной сатурновой дисциплиной."
    evidence_text: "Выраженная земная стихия ({earth:.0%}) и фиксированность ({fixed:.0%}) создают основу для долгосрочного строительства и дисциплинированного подхода."
    counter_text: "Огненная спонтанность ({fire:.0%}) может нарушать строительные планы."
    reflection: "Что вы строите или строили с наибольшей тщательностью?"

