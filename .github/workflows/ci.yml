name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  LLM_ENABLED: "false"
  LLM_PROVIDER: "mock"
  LLM_MODEL: "mock-self-v1"
  LLM_API_KEY: ""

jobs:
  # ── Backend Lint & Types ────────────────────────────────────────────────
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install deps
        run: pip install -e ".[dev]"
        working-directory: backend

      - name: Ruff lint
        run: ruff check .
        working-directory: backend

      - name: Ruff format check
        run: ruff format --check .
        working-directory: backend

      - name: Mypy
        run: mypy .
        working-directory: backend

  # ── Frontend Lint & Types ───────────────────────────────────────────────
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: frontend

      - name: ESLint
        run: npx eslint .
        working-directory: frontend

      - name: Prettier check
        run: npx prettier --check .
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

  # ── Backend Tests ───────────────────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: astrotype
          POSTGRES_PASSWORD: astrotype_test
          POSTGRES_DB: astrotype_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astrotype"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://astrotype:astrotype_test@localhost:5432/astrotype_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install WeasyPrint native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2 \
            libffi-dev \
            libgdk-pixbuf-2.0-0 \
            libglib2.0-0 \
            libharfbuzz-subset0 \
            libharfbuzz0b \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            shared-mime-info \
            fonts-dejavu-core

      - name: Install dependencies
        run: pip install -e ".[dev]"
        working-directory: backend

      - name: Run unit tests
        run: pytest tests/unit -v --tb=short --cov=app --cov-report=xml
        working-directory: backend

      - name: Run integration tests
        run: pytest tests/integration -v --tb=short --cov=app --cov-report=xml --cov-append
        working-directory: backend

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: backend/coverage.xml

  # ── Frontend Tests & Build ──────────────────────────────────────────────
  test-frontend:
    name: Test & Build Frontend
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run tests
        run: npm test -- --coverage
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  # ── Contract Validation ─────────────────────────────────────────────────
  validate-contracts:
    name: Validate Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate OpenAPI spec
        run: npx @redocly/cli lint contracts/openapi.yaml

      - name: Validate AsyncAPI spec
        run: npx @asyncapi/cli validate contracts/asyncapi.yaml

  # ── Security Audit ──────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python deps
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install -e ".[dev]"
        working-directory: backend

      - name: pip-audit
        run: pip-audit
        working-directory: backend

      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: frontend

  # ── Build ───────────────────────────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, validate-contracts, security-audit]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: astrotype-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: astrotype-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
