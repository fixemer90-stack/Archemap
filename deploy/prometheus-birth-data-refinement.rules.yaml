groups:
  - name: birth-data-refinement
    rules:
      - alert: BirthDataRefinementStuckGenerations
        expr: birth_data_refinement_stuck_generations > 0
        for: 10m
        labels:
          severity: warning
          service: birth-data-refinement
        annotations:
          summary: Birth-data refinement generations are stuck
          description: One or more queued or processing refinements exceeded the configured age threshold.
          runbook: docs/features/E10-birth-data-refinement/S05-tests-observability-rollout.md#alert-operator-checks
      - alert: BirthDataRefinementGenerationFailures
        expr: birth_data_refinement_recent_failures > 0
        for: 5m
        labels:
          severity: warning
          service: birth-data-refinement
        annotations:
          summary: Birth-data refinement generation failures detected
          description: The refinement monitor found at least one failed revision inside its configured window.
          runbook: docs/features/E10-birth-data-refinement/S05-tests-observability-rollout.md#alert-operator-checks
