        revision_id:
          type: string
          format: uuid
        generation_id:
          type: string
          format: uuid
        profile_id:
          type: string
          format: uuid
        changed_fields:
          type: array
          items:
            type: string
            enum: [birth_time, birth_time_accuracy, birth_place, latitude, longitude, timezone]
        status:
          type: string
          enum: [queued]
        next_available_at:
          type: string
          format: date-time
    BirthDataRevisionStatus:
      type: object
      additionalProperties: false
      required: [revision_id, generation_id, profile_id, changed_fields, status, chart_id, report_id, error_code, created_at, updated_at]
      properties:
        revision_id:
          type: string
          format: uuid
        generation_id:
          type: string
          format: uuid
        profile_id:
          type: string
          format: uuid
        changed_fields:
          type: array
          items:
            type: string
            enum: [birth_time, birth_time_accuracy, birth_place, latitude, longitude, timezone]
        status:
          type: string
          enum: [queued, processing, deterministic_ready, ready, failed]
        chart_id:
