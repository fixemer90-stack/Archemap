    CareerLocked:
      description: Active Plus or grandfathered Career entitlement is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CareerLockedErrorResponse"

    CareerNotFound:
      description: Owned Career resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CareerErrorResponse"

    CareerConflict:
      description: Career lifecycle or idempotency conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CareerErrorResponse"

    CareerValidationError:
      description: Career request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CareerErrorResponse"

    CareerUnavailable:
      description: Career generation queue or provider is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CareerErrorResponse"

    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RefinementError"

    RefinementBadRequest:
      description: No material change or inconsistent birth time accuracy
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RefinementError"

    ProfileNotOwned:
      description: Profile is not owned by the authenticated user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RefinementError"

    IdempotencyConflict:
      description: Idempotency key was reused with another normalized payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RefinementError"

    BirthPlaceNotGeocoded:
      description: Place, coordinates, or IANA timezone are invalid or inconsistent
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RefinementError"

    BirthDataRefinementCooldown:
      description: The account-wide rolling 24-hour cooldown has not elapsed
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RefinementCooldownError"

    RefinementEnqueueUnavailable:
      description: Revision persisted but worker dispatch is unavailable; retry with the same key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RefinementError"

  schemas:
    GeocodeResultItem:
      type: object
      additionalProperties: false
      required: [display_name, latitude, longitude, city, country, timezone, selection_token]
      properties:
        display_name:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        city:
          type: string
        country:
          type: string
        timezone:
          type: string
          description: IANA timezone resolved from the returned coordinates
        selection_token:
          type: string
          description: Signed, expiring proof for this exact geocoded result
    GeocodeSearchResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GeocodeResultItem"
    BirthDataRefinementRequest:
      type: object
      additionalProperties: false
      required: [birth_time, birth_time_accuracy, birth_place, latitude, longitude, timezone]
      properties:
        birth_time:
          oneOf:
            - type: string
              format: time
            - type: "null"
        birth_time_accuracy:
          type: string
          enum: [exact, approximate, unknown]
        birth_place:
          type: string
          minLength: 1
          maxLength: 300
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        timezone:
          type: string
          description: IANA timezone that must match server resolution for latitude/longitude
        geocode_selection_token:
          type: string
          nullable: true
          description: Signed selection proof returned by the geocode endpoint; required only when place, coordinates, or timezone change
    BirthDataRefinementStatus:
      type: object
      additionalProperties: false
      required: [profile_id, can_refine, last_refined_at, next_available_at, retry_after_seconds]
      properties:
        profile_id:
          type: string
          format: uuid
        can_refine:
          type: boolean
        last_refined_at:
