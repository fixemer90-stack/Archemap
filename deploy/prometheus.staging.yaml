global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yaml
  # Operator-owned temporary probes; no always-firing rule is shipped in the repo.
  # Whole directory bind permits creation/removal followed by Prometheus SIGHUP.
  - /etc/prometheus/child-alert-probes/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:9464]
